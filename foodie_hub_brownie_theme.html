<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AK Bakes - Brownies & Cakes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fff7f0;padding-bottom:20px}
header{background:#2b1200;color:#fff;text-align:center;padding:24px 10px 18px;position:relative}
header h1{font-size:42px;font-weight:900;letter-spacing:1px}
header h1 span{color:#ff8c42}
header p{letter-spacing:3px;color:#ffccaa;font-size:13px;margin-top:5px}
#adminBtn{position:absolute;top:15px;right:12px;background:#4a2400;color:#fff;border:none;padding:7px 13px;border-radius:20px;cursor:pointer}
.search-box{padding:14px}
.search-box input{width:100%;padding:14px 18px;border-radius:25px;border:1px solid #ffd9c0;font-size:16px;outline:none}
.filter{display:flex;gap:8px;padding:0 14px 12px}
.filter button{flex:1;padding:11px;border:none;border-radius:20px;font-weight:900;cursor:pointer;background:#ffe8d6}
.filter button.active{background:#2b1200;color:#fff}
h2{padding:0 14px;font-size:26px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
.card img{width:100%;height:200px;object-fit:cover}
.card-body{padding:12px}
.card-body h3{font-size:17px;line-height:1.2;min-height:42px}
.card-body p{color:#999;margin:6px 0;font-size:13px}
.badge{background:#ff8c42;color:#fff;font-size:11px;padding:3px 8px;border-radius:10px}
.price{font-size:22px;font-weight:900;margin:6px 0 10px}
.whatsapp{background:#22c55e;color:#fff;border:none;width:100%;padding:12px;border-radius:12px;font-weight:900;font-size:14px;cursor:pointer;margin-bottom:8px}
.row{display:flex;gap:8px}
.edit{flex:1;background:#ff9800;color:#fff;border:none;padding:11px;border-radius:10px;font-weight:900;cursor:pointer}
.delete{flex:1;background:#ff2222;color:#fff;border:none;padding:11px;border-radius:10px;font-weight:900;cursor:pointer}
footer{background:#2b1200;color:#fff;text-align:center;padding:22px 12px;margin-top:20px;line-height:1.7}
footer b{color:#22c55e}
#adminPanel{display:none;background:#fff;margin:12px;padding:15px;border-radius:15px;border:1px solid #ffd9c0}
#adminPanel input,#adminPanel select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px}
#adminPanel button{width:100%;padding:13px;background:#2b1200;color:#fff;border:none;border-radius:10px;font-weight:900;margin-top:8px}
</style>
</head>
<body>

<header>
<button id="adminBtn" onclick="checkAdmin()">⚙️ Admin</button>
<h1>AK <span>BAKES</span></h1>
<p>FRESH • SOFT • CHOCOLATY</p>
</header>

<div id="adminPanel">
<h3>➕ Naya Item Add Karein</h3>
<input id="pName" placeholder="Naam - Jaise Fudge Brownie">
<select id="pCat"><option value="Brownie">Brownie</option><option value="Cake">Cake</option></select>
<input id="pPrice" type="number" placeholder="Price - 499">
<input id="pImg" placeholder="Image Link Paste Karein">
<button onclick="addProduct()">✅ ADD ITEM</button>
<button onclick="document.getElementById('adminPanel').style.display='none'" style="background:#777">Band Karein</button>
</div>

<div class="search-box">
<input id="search" oninput="render()" placeholder="🔍 Search - Brownie, Cake...">
</div>

<div class="filter">
<button id="btnAll" class="active" onclick="setFilter('All')">All</button>
<button id="btnBrownie" onclick="setFilter('Brownie')">🍫 Brownie</button>
<button id="btnCake" onclick="setFilter('Cake')">🎂 Cake</button>
</div>

<h2>🍫 Our Menu</h2>
<div class="grid" id="products"></div>

<footer>
<p>© 2026 AK Bakes | Lahore, Pakistan</p>
<p>Freshly Baked Daily • Home Delivery Available 🚚</p>
<p>Order On WhatsApp: <b>0326 4580349</b></p>
</footer>

<script>
let WHATSAPP = "923264580349";
let filter = 'All';
let products = JSON.parse(localStorage.getItem('ak_bakes') || 'null') || [
 {name:"Classic Fudge Brownie", cat:"Brownie", price:499, img:"https://images.unsplash.com/photo-1606312619070-d48b4c652a52?w=600"},
 {name:"Nutella Loaded Brownie", cat:"Brownie", price:699, img:"https://images.unsplash.com/photo-1589375020261-2a6c8c1b1b1b?w=600"},
 {name:"Chocolate Chip Brownie", cat:"Brownie", price:599, img:"https://images.unsplash.com/photo-1618923850107-d1a234d7a73a?w=600"},
 {name:"Lotus Biscoff Brownie", cat:"Brownie", price:799, img:"https://images.unsplash.com/photo-1624353365286-3f8d62daad51?w=600"},
 {name:"Chocolate Fudge Cake - 1 Pound", cat:"Cake", price:1499, img:"https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600"},
 {name:"Lotus Cake - 1 Pound", cat:"Cake", price:1899, img:"https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=600"},
 {name:"Red Velvet Cake - 1 Pound", cat:"Cake", price:1799, img:"https://images.unsplash.com/photo-1586788680434-30d324b2d46f?w=600"},
 {name:"Birthday Special Cake - 2 Pound", cat:"Cake", price:2999, img:"https://images.unsplash.com/photo-1535141192574-5d4897c12636?w=600"}
];
function save(){ localStorage.setItem('ak_bakes', JSON.stringify(products)); render(); }
function setFilter(f){
 filter=f;
 document.querySelectorAll('.filter button').forEach(b=>b.classList.remove('active'));
 if(f==='All') document.getElementById('btnAll').classList.add('active');
 if(f==='Brownie') document.getElementById('btnBrownie').classList.add('active');
 if(f==='Cake') document.getElementById('btnCake').classList.add('active');
 render();
}
function render(){
 let q = document.getElementById('search').value.toLowerCase();
 let box = document.getElementById('products');
 let list = products.filter(p => (filter==='All' || p.cat===filter) && (p.name.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q)));
 box.innerHTML = list.map(p=>{
   let realIndex = products.indexOf(p);
   return `<div class="card">
     <img src="${p.img}" onerror="this.src='https://via.placeholder.com/400x400?text=AK+Bakes'">
     <div class="card-body">
       <span class="badge">${p.cat}</span>
       <h3 style="margin-top:6px">${p.name}</h3>
       <p>Freshly Baked • Lahore</p>
       <div class="price">Rs. ${p.price}</div>
       <button class="whatsapp" onclick="order('${p.name}',${p.price})">🟢 ORDER ON WHATSAPP</button>
       <div class="row">
         <button class="edit" onclick="editProduct(${realIndex})">✏️ EDIT</button>
         <button class="delete" onclick="deleteProduct(${realIndex})">🗑️ DELETE</button>
       </div>
     </div>
   </div>`
 }).join('');
}
function order(name, price){
 let msg = `Assalam-o-Alaikum AK Bakes! Mujhe ye order karna hai:%0A%0AItem: ${name}%0APrice: Rs. ${price}%0A%0AName:%0AAddress:%0ACity: Lahore`;
 window.open(`https://wa.me/${WHATSAPP}?text=${msg}`, '_blank');
}
function checkAdmin(){
 let pass = prompt("Admin Password Dalein:");
 if(pass === "ak123"){ document.getElementById('adminPanel').style.display='block'; alert("Welcome Admin!"); }
 else alert("Galat Password!");
}
function addProduct(){
 let n=document.getElementById('pName').value, c=document.getElementById('pCat').value, pr=document.getElementById('pPrice').value, im=document.getElementById('pImg').value;
 if(!n || !pr){ alert("Naam aur Price zaroori hai"); return; }
 products.unshift({name:n, cat:c, price:pr, img:im||"https://via.placeholder.com/400x400?text=AK+Bakes"});
 save(); alert("Item Add Ho Gaya!");
}
function editProduct(i){
 let p = products[i];
 let newPrice = prompt("Nayi Price Dalein:", p.price);
 if(newPrice) { p.price = newPrice; save(); }
}
function deleteProduct(i){
 if(confirm("Kya Aap isko delete karna chahte hain?")){ products.splice(i,1); save(); }
}
render();
</script>
</body>
</html>
